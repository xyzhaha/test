server:
  port: 8081

spring:
  application:
    name: trade-system-service
  datasource:
    url: jdbc:mysql://localhost:3306/trade_system?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.tradesystem
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 业务配置
trade:
  order:
    max-quantity: 99
  rate-limit:
    api:
      order-create:
        qps: 600
        timeout: 1
        message: "系统繁忙，请稍后重试"
      user-recharge:
        qps: 200
        timeout: 1
        message: "充值请求过多，请稍后重试"
      merchant-stock:
        qps: 100
        timeout: 1
        message: "库存操作过于频繁，请稍后重试"
    user:
      order-qps: 10
      recharge-qps: 5

merchant:
  settlement:
    cron: "0 0 2 * * ?"

# 订单超时配置
order:
  timeout:
    minutes: 30  # 订单超时时间（分钟）
    scan:
      limit: 100  # 每次扫描的最大订单数量
    cron: "0 0/5 * * * ?"  # 定时任务执行频率（每5分钟）

# 日志配置
logging:
  level:
    root: INFO
    com.example.tradesystem: DEBUG
